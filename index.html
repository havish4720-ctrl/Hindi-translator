<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Hindi Translator</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🌍 Universal Translator</h1>

<textarea id="inputText" placeholder="Type your text here..."></textarea>

<div class="buttons">
<button id="speakBtn">🎤 Speak</button>
<button id="translateBtn">🌐 Translate</button>
<button id="listenBtn">🔊 Listen</button>
<button id="copyBtn">📋 Copy</button>
</div>

<textarea id="outputText" placeholder="Translation will appear here..." readonly></textarea>

</div>

<script src="script.js"></script>

</body>
</html>
